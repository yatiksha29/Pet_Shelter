<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <link rel="stylesheet" href="style/responsive.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>

  <title>Document</title>
  <script>
    $(document).ready(function () {
      let active = localStorage.getItem("activeUser");
      $("#auser").html(active);
      if (active == null) {
        location.href = "index.html";
        return;
      }
      alert(active);
      $("#btnLogout").click(function () {
        localStorage.removeItem("activeUser");
        location.href = "index.html";
        return;
      })

      $("#changePass").blur(function () {
        var email1 = $("#changeEmail").val();
        var pwd1 = $("#changePass").val();
        alert(email1, pwd1);
        let config = {
          url: "/chkpwd",
          type: "get",
          data: {
            emailkuch: email1,
            pwdkuch: pwd1,
          }
        }
        $.ajax(config).done(function (resp, respJSONAry) {
          if (resp.length != "") {
            $("#txtNew").attr("disabled", false);
            $("#txtRe").attr("disabled", false);
          }
          else {
            $("#txtNew").attr("disabled", true);
            $("#txtRe").attr("disabled", true);
            alert("Email or Password is Incorrect");
          }
        }).fail(function (err) {
          $("err").html(resp);
        });
      });
      $("#txtRe").blur(function () {
        let sub1 = $("#txtNew").val();
        let sub2 = $("#txtRe").val();
        if (sub1 == sub2) {
          $("#btnU").attr("disabled", false);
        }
        else
          $("#btnU").attr("disabled", true);
      });
    });
  </script>

</head>


<body class="owner-page">

  <div class="container-fluid owner-main">

    <!-- NAVBAR -->
    <nav class="navbar owner-navbar">

      <a class="navbar-brand owner-brand" href="#">
        <img src="pics/petLogo3.webp" alt="Logo">
        <span>Cozy Cove</span>
      </a>

      <div class="owner-welcome">
        Welcome: <span id="auser"></span>
      </div>

    </nav>


    <!-- DASHBOARD CARDS -->
    <div class="container-fluid owner-dashboard">

      <div class="row g-4">

        <!-- PROFILE INFORMATION -->
        <div class="col-12 col-sm-6 col-xl-3">

          <div class="card owner-card">

            <div class="owner-card-image">
              <img src="pics/pet3.avif" alt="Profile Information">
            </div>

            <div class="card-body">
              <a href="/ownerPro" class="btn btn-primary">
                Profile Information
              </a>
            </div>

          </div>

        </div>


        <!-- SEARCH SHELTER -->
        <div class="col-12 col-sm-6 col-xl-3">

          <div class="card owner-card">

            <div class="owner-card-image">
              <img src="pics/pet3.avif" alt="Search Shelter">
            </div>

            <div class="card-body">
              <a href="/search-shelter" class="btn btn-primary">
                Search Shelter
              </a>
            </div>

          </div>

        </div>


        <!-- SETTINGS -->
        <div class="col-12 col-sm-6 col-xl-3">

          <div class="card owner-card">

            <div class="owner-card-image">
              <img src="pics/pet3.avif" alt="Settings">
            </div>

            <div class="card-body">
              <a href="#" class="btn btn-primary"
                 id="osetting"
                 data-bs-target="#mymodel"
                 data-bs-toggle="modal">
                Settings
              </a>
            </div>

          </div>

        </div>


        <!-- LOGOUT -->
        <div class="col-12 col-sm-6 col-xl-3">

          <div class="card owner-card">

            <div class="owner-card-image">
              <img src="pics/pet3.avif" alt="Logout">
            </div>

            <div class="card-body">
              <a href="#" class="btn btn-primary"
                 id="btnLogout">
                Logout
              </a>
            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- SETTINGS MODAL -->
    <div class="modal fade" id="mymodel" tabindex="-1">

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content owner-modal">

          <div class="modal-header">
            <h5 class="modal-title">Settings</h5>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
            </button>
          </div>

          <div class="modal-body">

            <form method="post">

              <div class="mb-3">
                <label class="form-label">Email Id</label>
                <input type="text"
                       class="form-control"
                       id="changeEmail"
                       name="changeEmail">
              </div>

              <div class="mb-3">
                <label class="form-label">Old Password</label>
                <input type="password"
                       class="form-control"
                       id="changePass"
                       name="changePass">
              </div>

              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input class="form-control"
                       type="password"
                       name="txtNew"
                       id="txtNew"
                       disabled>
              </div>

              <div class="mb-3">
                <label class="form-label">Recheck Password</label>
                <input class="form-control"
                       type="password"
                       name="txtRe"
                       id="txtRe"
                       disabled>
              </div>

              <button type="submit"
                      class="btn btn-primary w-100"
                      formaction="/update-password"
                      id="btnU"
                      disabled>
                Update
              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
