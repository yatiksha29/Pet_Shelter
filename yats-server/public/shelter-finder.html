<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">


    <link rel="stylesheet" href="style/responsive.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <title>Document</title>
    <script>
        $(document).ready(function () {
      let active=localStorage.getItem("activeUser");
      $("#auser").html(active);
      $("#txtEmail").val(active).prop("disabled",true);
        })
        var module = angular.module("mymodule", []);
        var controller = module.controller("mycontroller", function ($scope, $http) {
            $scope.jsonAllCities = [];
            $scope.doFetchCities = function () {
                let path = "/Fetch-all-cities";
                $http.get(path).then(doneFx, failFx);
                function doneFx(response) {
                    $scope.jsonAllCities = response.data;
                }
                function failFx(response) {
                    alert(response.data);
                }
            }

            // $scope.doShowSel = function () {
            //     alert($scope.selId);
            // }

            //-------------------Fetch all cities-----------------
            $scope.jsonData = [];
            $scope.doShowSel = function () {
                var obj1 = $scope.selId;
                let path = "/fetch-shfinder-record?citykuch=" + obj1;

                $http.get(path).then(doneFx, failFx);
                function doneFx(response) {

                    $scope.jsonData = response.data;
                }
                function failFx(response) {
                    alert(response.data);
                }
            }
        })
    </script>

</head>


<body class="shelter-page" ng-app="mymodule"
      ng-controller="mycontroller"
      ng-init="doFetchCities();">

    <div class="container-fluid shelter-main">

        <!-- NAVBAR -->
        <nav class="navbar shelter-navbar">

            <div class="container-fluid">

                <a class="navbar-brand shelter-brand" href="#">
                    <img src="pics/petLogo3.webp"
                         alt="Logo"
                         class="rounded-circle">

                    <span>Cozy Cove</span>
                </a>

                <span class="welcome-text">
                    Welcome: <span id="auser"></span>
                </span>

            </div>

        </nav>


        <!-- CITY SELECTION -->
        <div class="city-section">

            <label class="form-label">Cities</label>

            <select class="form-select"
                    ng-change="doShowSel();"
                    ng-model="selId"
                    name="txtCity"
                    id="txtCity">

                <option value="">Choose...</option>

                <option ng-repeat="obj in jsonAllCities"
                        value="{{obj.city}}">
                    {{obj.city}}
                </option>

            </select>

        </div>


        <!-- SHELTER CARDS -->
        <div class="container-fluid shelter-list">

            <div class="row g-4">

                <div class="col-12 col-sm-6 col-lg-4 col-xl-3"
                     ng-repeat="obj in jsonData">

                    <div class="card shelter-card h-100">

                        <div class="shelter-image">

                            <img src="uploads/{{obj.shelpic}}"
                                 alt="Shelter Image">

                        </div>

                        <div class="card-body">

                            <h5 class="card-title">
                                {{obj.name}}
                            </h5>

                            <div class="shelter-info">

                                <h6>Emailid:</h6>
                                <p>{{obj.emailid}}</p>

                                <h6>Website:</h6>
                                <p>{{obj.website}}</p>

                                <h6>City:</h6>
                                <p>{{obj.city}}</p>

                            </div>

                            <button class="btn btn-primary w-100">
                                More Details
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
